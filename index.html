<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf3f8;--sf:#ffffff;--ink:#241b25;--mut:#786b77;--ac:#b51f70;--bt:#b51f70;--acs:#fceaf2;--pl:#941657;--gold:#9a7130;--on:#ffffff;--ok:#187653;--bad:#b3263e;--ln:#eadfe7;--sh:0 4px 14px rgba(74,21,96,.10);--tl1:#d94a91;--tl2:#941657;color-scheme:light}

*{box-sizing:border-box}

#modal .box{background:var(--sf);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:18px;width:100%;max-width:380px;max-height:90%;overflow:auto}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.35}
.rc td{padding:1px 2px;vertical-align:top}.rc .r{text-align:right}
#toast{display:none;position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-weight:600;text-align:center}

@media print{#hd,#app,#nav,.noprint{display:none!important}#modal .ov{position:static;background:none;padding:0}#modal .box{box-shadow:none;max-width:80mm;max-height:none;overflow:visible;padding:0 0 32mm}}

<header id="hd" class="noprint"><div class="in"><div class="lg">LB</div><div><div class="ey">LULA BEAUTY BOX</div><div class="tt">Punto de venta</div></div></div></header>
<div id="app"></div><div id="toast"></div><div id="modal"></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),r2=n=>Math.round(n*100)/100,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4000)}
window.alert=toast;
const money=n=>'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});

function seed(){return{seq:1,cash:0,settings:{min:3799,disc:5,pts:2,iva:16,wholesaleOn:true,pointsOn:true},
products:[['7501001','Gel constructor rosa 30 ml',289,12,3],['7501002','Polvo acrílico transparente 100 g',349,20,5],['7501003','Monómero profesional 120 ml',259,15,4],['7501004','Sanitizante 500 ml',119,30,6],['7501005','Kit básico de acrílico',1299,8,2],['7501006','Kit de poligel',1899,6,2],['7501007','Kit profesional de acrílico',3999,3,1],['7501008','Kit de pedicure',899,7,2]].map((p,i)=>({id:'p'+i,code:p[0],name:p[1],price:p[2],stock:p[3],min:p[4]})),
customers:[],held:[],tickets:[],log:[]}}
let S;try{S=JSON.parse(localStorage.getItem('pos1')||'null')}catch(e){}S=S||seed();S.shifts=S.shifts||[];S.shift=S.shift||null;S.camps=S.camps||[];S.aps=S.aps||[];S.apSeq=S.apSeq||1;ensPins();
const save=()=>{try{localStorage.setItem('pos1',JSON.stringify(S))}catch(e){}if(typeof cloudQ=='function')cloudQ()};
const logit=t=>{S.log.unshift({at:new Date().toISOString(),by:U,t});save()};
let U=null,tab='venta',pinSel='cajero',C=newCart();
function newCart(){return{lines:[],cust:'',promo:'none',pay:'efectivo',iva:null,from:false}}
const prod=id=>S.products.find(p=>p.id==id),cust=id=>S.customers.find(c=>c.id==id);
const per=(d=new Date())=>d.getFullYear()+(d.getMonth()<6?'A':'B');
const pts=c=>r2((c.lots||[]).filter(l=>l.p==per()).reduce((a,l)=>a+l.a,0));
function calc(){const st=S.settings,sub=r2(C.lines.reduce((a,l)=>a+lineTotal(l),0)),cu=cust(C.cust),bal=cu?pts(cu):0,cp=actC(),hasMd=!!C.md||C.lines.some(l=>l.md),elig=st.wholesaleOn&&!cp&&!hasMd&&sub>=st.min;
let promo=C.promo;if(promo=='disc'&&!elig)promo='none';if(promo=='pts'&&!(st.pointsOn&&!cp&&bal>0))promo='none';if(hasMd)promo='none';
const mdisc=C.md?(C.md.t=='pct'?r2(sub*C.md.v/100):r2(Math.min(C.md.v,sub))):0,disc=r2((promo=='disc'?r2(sub*st.disc/100):0)+mdisc),red=promo=='pts'?Math.min(bal,sub):0,total=r2(sub-disc-red),
earn=promo=='none'&&!hasMd&&st.pointsOn&&!cp&&cu?r2(total*st.pts/100):0,rate=C.iva??(cu?(cu.border?8:16):st.iva);
return{sub,disc,red,total,earn,rate,iva:r2(total-total/(1+rate/100)),elig,bal,promo,cu,hasMd,mdisc}}
function modal(title,body,ok,fn){const m=$('#modal');m.innerHTML='<div class="ov"><div class="box"><h2 style="margin-top:0">'+title+'</h2>'+body+'<div class="row noprint" style="margin-top:12px">'+(ok?'<button id="mok">'+ok+'</button>':'')+'<button class="s" id="mx">Cerrar</button></div></div></div>';
$('#mx').onclick=()=>m.innerHTML='';if(ok)$('#mok').onclick=()=>{if(fn()!==false)m.innerHTML=''};const i=m.querySelector('input');if(i)i.focus()}
function needAdmin(fn){if(U=='admin')return fn();modal('Clave del administrador','<input type="password" id="ap" inputmode="numeric" placeholder="Clave" onkeydown="if(event.key==\'Enter\')$(\'#mok\').click()">'+kpad('ap','$(\'#mok\').click()')+'<p class="mut">Esta acción requiere autorización.</p>','Autorizar',()=>{if(S.pins.admin!=hp($('#ap').value,S.pins.salt)){alert('Clave incorrecta');return false}setTimeout(fn,0)})}
function nav(){const t=[['venta','Venta'],['espera','Espera ('+S.held.length+')'],['clientes','Clientes'],['prods','Productos'],['dmg','Dañados ('+(S.dmg||[]).filter(d=>d.st=='pend').length+')'],['tickets','Tickets'],['aps','Apartados'],['caja','Caja']];if(U=='admin')t.push(['reportes','Reportes'],['camp','Campañas'],['ajustes','Ajustes']);
$('#nav').innerHTML=U?t.map(x=>'<button class="'+(tab==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join(''):''}
function go(t){tab=t;render()}
function render(){nav();const a=$('#app');if(!U){if(RSC){a.innerHTML=rescueForm();return}a.innerHTML='<h2>Punto de venta</h2><div class="card"><div class="g2"><button class="'+(pinSel=='cajero'?'':'s')+'" onclick="pinSel=\'cajero\';render()">Cajero</button><button class="'+(pinSel=='admin'?'':'s')+'" onclick="pinSel=\'admin\';render()">Administrador</button></div><p></p><input type="password" id="pin" inputmode="numeric" placeholder="Clave" onkeydown="if(event.key==\'Enter\')login()">'+kpad('pin','login()')+(S.pins.def?'<p class="mut">Claves iniciales: cajero 1111, administrador 9999. Cámbialas en Ajustes.</p>':'')+''+(LE?'<p class="bad">'+LE+'</p>':'')+'<button onclick="login()">Entrar</button><p></p><button class="s sm" onclick="RSC=true;LE=\'\';render()">Olvidé mi clave de administrador</button></div>';return}
a.innerHTML=cloudBar()+sessBar()+({venta:vVenta,espera:vEspera,clientes:vClientes,prods:vProds,dmg:vDmg,tickets:vTickets,caja:vCaja,reportes:vRep,camp:vCamp,aps:vAps,ajustes:vAjustes})[tab]();
if(tab=='venta'){const s=$('#scan');if(s)s.focus()}}
function login(){const p=$('#pin').value;if(S.pins[pinSel]==hp(p,S.pins.salt)){LE='';U=pinSel;tab='venta';render();if(DIR&&DIRST=='need')dirAllow();if(!PR&&navigator.usb&&location.protocol=='file:')prConnect()}else{LE='Clave incorrecta';render()}}
function vVenta(){const k=calc(),st=S.settings;
return (U=='admin'&&S.tickets.length&&bkOld()?'<div class="warn">Hace más de 7 días que no respaldas tus datos. Hazlo en Ajustes.</div>':'')+(actC()?'<div class="warn">Campaña activa: '+esc(actC().name)+'. Puntos y mayoreo apagados.</div>':'')+(!S.shift?'<div class="warn">No hay turno abierto. Ábrelo en la pestaña Caja para poder cobrar.</div>':'')+(S.cash>=5000?'<div class="warn">Efectivo en caja: '+money(S.cash)+'. Toca hacer un retiro de $5,000. <button class="sm" onclick="retiro()">Registrar retiro</button></div>':'')+
'<div class="row"><input type="text" id="scan" autocomplete="off" oninput="sq(this.value)" placeholder="Escribe para buscar o escanea" onkeydown="if(event.key==\'Enter\')add(this.value)"><button onclick="add($(\'#scan\').value)">Agregar</button><button class="s" onclick="priceQ()">Precio</button></div>'+
'<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'+catBar()+'</div><div id="sres" style="margin:8px 0">'+catList()+'</div>'+
'<div class="card">'+(C.lines.length?C.lines.map((l,i)=>{const p=prod(l.id);return'<div class="row sp"><div>'+esc(p.name)+'<div class="mut">'+money(l.mp??p.price)+' c/u'+(l.md?' · desc. manual '+(l.md.t=='pct'?l.md.v+'%':money(l.md.v)):'')+(l.mp?' · precio manual':offer(l.id)?' · oferta '+offer(l.id).pct+'%':'')+'</div></div><div class="row"><button class="s sm" onclick="mdLine('+i+')">Desc.</button><button class="s sm" onclick="qty('+i+',-1)">−</button><b>'+l.q+'</b><button class="s sm" onclick="qty('+i+',1)">+</button><b style="min-width:84px;text-align:right">'+money(lineTotal(l))+'</b></div></div>'}).join(''):'<p class="mut">Ticket vacío. Escanea un producto para empezar.</p>')+'</div>'+
'<div class="card">'+custPick()+'<select onchange="C.iva=this.value?+this.value:null;render()" style="margin-top:8px"><option value="">IVA automático ('+k.rate+'%)</option><option value="8"'+(C.iva==8?' selected':'')+'>IVA 8%</option><option value="16"'+(C.iva==16?' selected':'')+'>IVA 16%</option></select>'+
'<p class="mut">Una sola promoción por compra.'+(k.hasMd?' <b>Descuento manual aplicado: sin mayoreo, puntos ni canje.</b>':'')+(k.cu?' Puntos del cliente: '+k.bal.toFixed(2):'')+'</p>'+
'<label class="row"><input type="radio" name="pr" '+(k.promo=='none'?'checked':'')+' onchange="C.promo=\'none\';render()"> Sin promoción'+(k.cu&&st.pointsOn&&!actC()?' (gana '+money(k.earn)+' en puntos)':'')+'</label>'+
(k.elig?'<label class="row"><input type="radio" name="pr" '+(k.promo=='disc'?'checked':'')+' onchange="C.promo=\'disc\';render()"> Descuento por mayoreo '+st.disc+'%</label>':'')+
(k.cu&&st.pointsOn&&!actC()&&!k.hasMd&&k.bal>0?'<label class="row"><input type="radio" name="pr" '+(k.promo=='pts'?'checked':'')+' onchange="C.promo=\'pts\';render()"> Canjear puntos</label>':'')+
'<select style="margin-top:8px" onchange="C.pay=this.value"><option '+(C.pay=='efectivo'?'selected':'')+'>efectivo</option><option '+(C.pay=='tarjeta'?'selected':'')+'>tarjeta</option><option '+(C.pay=='transferencia'?'selected':'')+'>transferencia</option><option '+(C.pay=='mixto'?'selected':'')+'>mixto</option></select></div>'+
'<div class="card"><div class="row sp"><span>Subtotal</span><span>'+money(k.sub)+'</span></div>'+(k.disc?'<div class="row sp ok"><span>'+(k.hasMd?'Descuento manual':'Descuento')+'</span><span>−'+money(k.disc)+'</span></div>':'')+(k.red?'<div class="row sp ok"><span>Puntos canjeados</span><span>−'+money(k.red)+'</span></div>':'')+
'<div class="row sp"><span class="mut">IVA incluido ('+k.rate+'%)</span><span class="mut">'+money(k.iva)+'</span></div><div class="row sp"><span>Total</span><span class="tot">'+money(k.total)+'</span></div></div>'+
'<div class="row"><button onclick="cobrar()">Cobrar</button><button class="s" onclick="hold()">Poner en espera</button><button class="s" onclick="mdTicket()">Descuento</button><button class="s" onclick="apartar()">Apartar</button><button class="d" onclick="clearCart()">Vaciar</button></div>'}
function add(v){v=v.trim();if(!v)return;const lo=v.toLowerCase(),ex=S.products.find(p=>p.code.toLowerCase()==lo);if(ex)return addP(ex.id);const tm=v.match(/^T0*(\d+)$/i);if(tm){const t=S.tickets.find(x=>x.n==+tm[1]);const s=$('#scan');if(s)s.value='';if(t)return rcpt(t);return alert('Ticket no encontrado')}const m=matchP(v);if(m.length==1)return addP(m[0].id);if(!m.length)return alert('Producto no encontrado');sq(v)}
function addP(id){const p=prod(id);if(p.off)return alert('Producto no disponible');if(!(p.price>0))return askPrice(id);const l=C.lines.find(l=>l.id==id&&!l.mp);l?l.q++:C.lines.push({id,q:1});render()}
function askPrice(id){const p=prod(id);needAdmin(()=>modal('Precio manual','<p>'+esc(p.name)+' no tiene precio. El administrador lo fija solo para esta venta.</p><input type="number" id="mp" placeholder="Precio con IVA">','Agregar',()=>{const v=parseFloat($('#mp').value);if(!(v>0)){alert('Pon un precio mayor a 0');return false}C.lines.push({id,q:1,mp:r2(v)});logit('Precio manual '+money(v)+' en '+p.name);render()}))}
function togP(id){const p=prod(id);p.off=!p.off;logit((p.off?'Marcó no disponible ':'Marcó disponible ')+p.name);save();const e=$('#plist'),q=$('#pq2');if(e)e.innerHTML=listP(q?q.value:'')}
function sq(v){const el=$('#sres');if(!el)return;if(!v.trim()){el.innerHTML=catList();return}let m=matchP(v),note='';if(CATSEL){const mc=m.filter(p=>grpOf(p)==CATSEL);if(mc.length){m=mc;note='<p class="mut">Buscando en «'+CATSEL+'». Toca la categoría otra vez para buscar en todo.</p>'}else if(m.length)note='<p class="mut">Sin resultados en «'+CATSEL+'»; se muestran todas las categorías.</p>'}const s=m.slice(0,30);
el.innerHTML=note+(s.length?s.map(p=>{const o=offer(p.id),av=avail(p.id);return'<div class="card row sp" style="cursor:pointer" onclick="addP(\''+p.id+'\')"><div>'+esc(p.name)+'<div class="mut">'+esc(p.code)+(o?' · oferta '+o.pct+'%':'')+'</div></div><div style="text-align:right"><b>'+(p.price>0?money(p.price):'Precio manual')+'</b><div class="'+(p.off||av<=0?'bad':'mut')+'">'+(p.off?'no disponible':av>0?av+' disp.':'agotado')+'</div></div></div>'}).join('')+(m.length>30?'<p class="mut">Mostrando 30 de '+m.length+'. Sigue escribiendo para acotar.</p>':''):'<p class="mut">No se encontró ningún producto.</p>')}
const nz=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fz=(t,q)=>{t=nz(t);return nz(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w))};
const matchP=v=>S.products.filter(p=>fz(p.name+' '+p.code,v));
function qty(i,d){const l=C.lines[i];if(d>0){l.q++;render();return}const go=()=>{l.q--;if(l.q<1)C.lines.splice(i,1);render()};C.from?needAdmin(()=>{logit('Quitó artículo de ticket en espera');go()}):go()}
function clearCart(){if(!C.lines.length)return;const go=()=>{C=newCart();render()};C.from?needAdmin(()=>{logit('Vació ticket en espera');go()}):go()}
function hold(){if(!C.lines.length)return;S.held.push({cart:C,by:U,at:new Date().toISOString()});save();C=newCart();render()}
function cobrar(){const k=calc();if(!C.lines.length)return alert('El ticket está vacío');if(!S.shift)return alert('Abre un turno en la pestaña Caja antes de cobrar');
for(const l of C.lines){const p=prod(l.id);if(p.off)return alert('No disponible: '+p.name);if(p.price>0&&avail(l.id)<l.q){return alert('Sin existencia suficiente: '+p.name)}}
if(C.pay=='mixto'&&k.total>0)mixAsk(k.total,(pays,recv)=>cobrar2(recv,pays));else if(C.pay=='efectivo'&&k.total>0)cashAsk(k.total,r=>cobrar2(r));else cobrar2(null)}
function cobrar2(recv,pays){const k=calc();
const t={n:S.seq++,sh:S.shift.id,date:new Date().toISOString(),by:U,pay:k.total>0?C.pay:'puntos',cust:k.cu?k.cu.name:'',custId:C.cust,promo:k.promo,sub:k.sub,disc:k.disc,red:k.red,total:k.total,earn:k.earn,rate:k.rate,iva:k.iva,recv:recv,chg:recv==null?null:r2(recv-(pays?pays.find(p=>p.m=='efectivo').a:k.total)),pays:pays||undefined,hasMd:k.hasMd||undefined,inv:'pend',void:false,lines:C.lines.map(l=>({name:prod(l.id).name+(l.mp?' (precio manual)':''),id:l.id,q:l.q,price:l.mp??prod(l.id).price,amt:lineTotal(l)}))};
C.lines.forEach(l=>{prod(l.id).stock-=l.q;const o=l.mp?null:offer(l.id);if(o)o.sold=(o.sold||0)+Math.min(l.q,Math.max(0,o.cap-(o.sold||0)))});
if(k.cu){const c=k.cu;c.lots=c.lots||[];if(k.red){let r=k.red;c.lots.filter(x=>x.p==per()).forEach(x=>{const u=Math.min(x.a,r);x.a=r2(x.a-u);r-=u})}
if(k.earn){const x=c.lots.find(x=>x.p==per());x?x.a=r2(x.a+k.earn):c.lots.push({p:per(),a:k.earn})}t.bal=pts(c)}

function parseCSV(t){t=t.replace(/^\uFEFF/,'');const l=t.split('\n')[0],d=l.split(';').length>l.split(',').length?';':',',rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==d){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x!==''))rows.push(r);const h=rows.shift().map(x=>x.trim());return rows.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))}

rows.forEach((r,i)=>{const name=(r.ProductName||'').replace(/\s+/g,' ').trim(),price=parseFloat(r.SalePriceIncTax);if(!name)return;if(!(price>=0)){sk.price++;return}if(price==0)sk.open++;if(nm.has(name.toLowerCase())){sk.dup++;return}let st=parseInt(r.CurrentStock)||0;if(st<0){st=0;sk.neg++}let code=(r.Barcode||'').trim();if(!code||codes.has(code)){do{code='EN'+String(sq++).padStart(4,'0')}while(codes.has(code));sk.cod++}codes.add(code);nm.add(name.toLowerCase());ok.push({id:'p'+Date.now()+'_'+i,code,name,price:r2(price),stock:st,min:parseInt(r.MinimumStock)||0,cat:r.CategoryId||''})});

let DIR=null,DIRST='none',CLT=null,CLAT=null,CLERR='';

await wr('pos-respaldo.json');await wr('pos-respaldo-'+now.toISOString().slice(0,10)+'.json');
try{const lim=Date.now()-35*864e5;for await(const [n] of DIR.entries()){const m=n.match(/^pos-respaldo-(\d{4}-\d\d-\d\d)\.json$/);if(m&&new Date(m[1]).getTime()<lim)await DIR.removeEntry(n)}}catch(e){}

const payTxt=x=>x.pays?x.pays.map(p=>p.m+' '+money(p.a)).join(' + '):x.pay;
function retPays(t,amt){if(!t.pays)return undefined;const a=t.pays.map(p=>({m:p.m,a:r2(p.a*amt/t.total)}));const d=r2(amt-a.reduce((x,p)=>x+p.a,0));a[a.length-1].a=r2(a[a.length-1].a+d);return a.filter(p=>p.a>0)}
function mdAsk(title,cur,fn){modal(title,'<div class="row"><label class="row"><input type="radio" name="mdt" value="pct" '+(!cur||cur.t=='pct'?'checked':'')+'> Porcentaje (%)</label><label class="row"><input type="radio" name="mdt" value="amt" '+(cur&&cur.t=='amt'?'checked':'')+'> Pesos ($)</label></div><input type="number" id="mdv" inputmode="decimal" step="0.01" placeholder="Cantidad" value="'+(cur?cur.v:'')+'">'+(cur?'<p class="mut">Déjalo vacío o en 0 para quitar el descuento.</p>':'')+'<p class="mut">Con descuento manual no aplican mayoreo, puntos ni canje, y la compra no genera puntos.</p>','Aplicar',()=>{const t=document.querySelector('input[name=mdt]:checked').value,v=parseFloat($('#mdv').value)||0;if(v<0||(t=='pct'&&v>100)){alert('Revisa la cantidad');return false}setTimeout(()=>fn(v>0?{t,v}:null),0)})}
const mdT=m=>m?(m.t=='pct'?m.v+'%':money(m.v)):'quitado';
function mdLine(i){needAdmin(()=>setTimeout(()=>{const l=C.lines[i];if(!l)return;mdAsk('Descuento del producto',l.md,m=>{if(m)l.md=m;else delete l.md;logit('Descuento manual de producto '+prod(l.id).name+': '+mdT(m)+' (autorizó admin)');render()})},0))}
function mdTicket(){needAdmin(()=>setTimeout(()=>mdAsk('Descuento del ticket',C.md,m=>{C.md=m;logit('Descuento manual de ticket: '+mdT(m)+' (autorizó admin)');render()}),0))}
function mixAsk(total,cb){setTimeout(()=>modal('Pago mixto','<p>Total: <b class="tot">'+money(total)+'</b></p><label class="mut">Tarjeta</label><input type="number" id="mxt" inputmode="decimal" step="0.01" oninput="mixUp('+total+')"><label class="mut">Transferencia</label><input type="number" id="mxr" inputmode="decimal" step="0.01" oninput="mixUp('+total+')"><div id="mxc" class="tot mut" style="margin:8px 0">Efectivo: '+money(total)+'</div><div id="mxw"><label class="mut">Efectivo recibido</label><input type="number" id="mxe" inputmode="decimal" step="0.01" oninput="mixUp('+total+')"></div><div id="mxg" class="tot mut">Cambio: —</div>','Cobrar',()=>{const t=mixVals(total);if(t.cash<0){alert('Tarjeta y transferencia suman más que el total');return false}if(t.cash>0&&!(t.recv>=t.cash)){alert('El efectivo recibido no alcanza para la parte en efectivo');return false}const pays=[];if(t.cash>0)pays.push({m:'efectivo',a:t.cash});if(t.card>0)pays.push({m:'tarjeta',a:t.card});if(t.tr>0)pays.push({m:'transferencia',a:t.tr});if(pays.length<2){alert('Para pago mixto captura al menos dos métodos. Si es un solo método, elígelo en la lista.');return false}setTimeout(()=>cb(pays,t.cash>0?r2(t.recv):null),0)}),0)}
function mixVals(total){const card=r2(parseFloat($('#mxt').value)||0),tr=r2(parseFloat($('#mxr').value)||0);return{card,tr,cash:r2(total-card-tr),recv:parseFloat($('#mxe').value)}}
function mixUp(total){const t=mixVals(total),c=$('#mxc'),g=$('#mxg');c.className='tot '+(t.cash<0?'bad':'mut');c.textContent='Efectivo: '+(t.cash<0?'tarjeta y transferencia suman de más':money(t.cash));$('#mxw').style.display=t.cash>0?'block':'none';if(t.cash>0){if(isNaN(t.recv)){g.className='tot mut';g.textContent='Cambio: —'}else if(t.recv<t.cash){g.className='tot bad';g.textContent='Faltan '+money(r2(t.cash-t.recv))}else{g.className='tot ok';g.textContent='Cambio: '+money(r2(t.recv-t.cash))}}else{g.className='tot';g.textContent=''}}

const bcCode=c=>String(c).replace(/[^\x20-\x7e]/g,'').trim().slice(0,40)||'0';
function lblBytes(p,o){const b=[],add=(...xs)=>xs.forEach(x=>Array.isArray(x)?b.push(...x):b.push(...enc(x))),ln=s=>{add(s,[10])};
add([27,64,27,116,0,27,97,1,27,69,1]);wrap(p.name,40).slice(0,3).forEach(ln);add([27,69,0]);
if(o.price&&p.price>0){add([29,33,17,27,69,1]);ln(money(p.price));add([29,33,0,27,69,0])}
add([10]);add(bcB(bcCode(p.code)));add(o.cut?[10,10,10,29,86,66,0]:[10,10,10,10]);return b}
function lblUI(id){const p=prod(id);modal('Etiqueta · '+esc(p.name),'<div class="rc" style="text-align:center"><b>'+esc(p.name)+'</b>'+(p.price>0?'<br><span class="tot">'+money(p.price)+'</span>':'')+'<br>||| ||| |||<br>'+esc(bcCode(p.code))+'</div><label class="mut">Cantidad de etiquetas</label><input type="number" id="lq" inputmode="numeric" value="1" min="1" max="200"><label class="row" style="margin-top:8px"><input type="checkbox" id="lp" checked> Incluir precio</label><label class="row"><input type="checkbox" id="lc" checked> Cortar el papel después de cada etiqueta</label>','Imprimir',()=>{const n=parseInt($('#lq').value)||0;if(n<1||n>200){alert('Pon entre 1 y 200 etiquetas');return false}if(!PR){alert('Conecta la impresora primero (Caja o Ajustes).');return false}const o={price:$('#lp').checked,cut:$('#lc').checked};let b=[];for(let i=0;i<n;i++)b=b.concat(lblBytes(p,o));prSend(b);logit('Imprimió '+n+' etiqueta(s) de '+p.name);save()})}

function themeNow(){try{return localStorage.getItem('pos_theme')||'auto'}catch(e){return 'auto'}}
function applyTheme(){const t=themeNow(),r=document.documentElement;if(t=='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
function cycTheme(){const n={auto:'light',light:'dark',dark:'auto'}[themeNow()];try{localStorage.setItem('pos_theme',n)}catch(e){}applyTheme();render()}
applyTheme();
render();
</script><script>try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}</script></body></html>
